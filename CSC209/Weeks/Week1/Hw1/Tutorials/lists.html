<!DOCTYPE html>
<html>
<head>
    <title>List Practice</title>
</head>
<body>
    <h1>Practicing Lists</h1>

    <h2>Ordered List</h2>
    <ol>
        <li>List item 1</li>
        <li>List item 2</li>
        <li>List item 3</li>
    </ol>

    <h2>Unordered Lists</h2>
    <ul>
        <li>List item 1</li>
        <li>List item 2</li>
        <li>List item 3</li>
    </ul>

    <h2>Description Lists</h2>
    <dl>
        <dt>Term</dt>
        <dd>Description</dd>
        <dt>Term 2</dt>
        <dd>Description 2</dd>
    </dl>

</body>
</html>
