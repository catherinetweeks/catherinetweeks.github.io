<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract Art Canvas</title>
    <link rel="stylesheet" href="./Creative/style.css">
    <script src="./Creative/script.js"></script>
</head>
<body>
    <div class="main-content">
        <h1>Abstract Art Canvas</h1>
        <p>Press the button below to add a random shape in a random color to the canvas below.</p>

        <button onclick="addShape()">Click me!</button>

        <div id="canvas-container">
            <canvas id="canvas" width="800" height="500" style="border:1px solid #000000; background-color: white;"></canvas>
        </div>
    </div>
</body>
</html>
