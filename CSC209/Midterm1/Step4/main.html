<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Illustrator</title>
    <link rel="stylesheet" href="./css/style.css">
    <script>
        const NRPTS = 5;
        const NREDGES = 5;
    </script>
</head>
<body>
    <header>
        <h1>Graph Illustrator</h1>
    </header>

    <div id="main">
        <div class="sidebar">
            <div id="info">
                <div id="accordion-container">
                    <button class="accordion">Info</button>
                    <div class="panel">
                        <p id="nredges">Number of edges: </p>
                        <p id="nrpts">Number of points: </p>
                    </div>
                </div>
            </div>
            <button id="redraw">Generate New Graph</button>
            <button id="get-coords">Get Coordinates</button>
        <div>
            <p id="display-coords"></p>
        </div>
    </div>

    <main class="main-content">
        <canvas id="pointsCanvas" width="800" height="600" style="border:1px solid #000;"></canvas>

    </main>
    </div>

    <footer>
        <p>Graph Illustrator made by Catherine Weeks</p>
        <button id="download">Download Graph</button>
    </footer>

    
    <script type="module">
        import { drawAll } from './js/graphicFunctions.js';
        import { getPoints, getEdges, displayCoords } from './js/domFunctions.js';
        import { downloadCanvas } from './js/downloadCanvas.js';
            
        getPoints(NRPTS);
        getEdges(NREDGES);

        let points = drawAll(NRPTS, NREDGES);

        document.getElementById("redraw").addEventListener("click", () => {
        points = drawAll(NRPTS, NREDGES);
            document.getElementById("display-coords").innerText = "";
        });

        document.getElementById("get-coords").addEventListener("click", () => {
            displayCoords(points);
        });

        document.getElementById("download").addEventListener("click", () => {
            downloadCanvas();
        });

        // Accordion code
        var acc = document.getElementsByClassName("accordion");
        var i;

        for (i = 0; i < acc.length; i++) {
        acc[i].addEventListener("click", function() {
            this.classList.toggle("active");

            var panel = this.nextElementSibling;
            if (panel.style.display === "block") {
            panel.style.display = "none";
            } else {
            panel.style.display = "block";
            }
        });
        }

    </script>

</body>
</html>
